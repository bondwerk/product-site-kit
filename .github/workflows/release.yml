name: Release
permissions:
  contents: read
on:
  push:
    tags: ['v*.*.*']
jobs:
  # Build und Pack in einem eigenen Job VOR den Tests (Council P2): Test-Code aus den
  # devDependencies läuft erst, wenn der Tarball schon als Artefakt feststeht.
  paket:
    runs-on: ubuntu-latest
    # Ohne npm-Cache: Release-Jobs bauen aus dem Lockfile, nicht aus einem geteilten Cache.
    outputs:
      integritaet: ${{ steps.integritaet.outputs.integritaet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - name: Tag liegt auf main und entspricht der Paketversion
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # npm 10 bricht auf diesem Lockfile ab (edgesOut); npm 11 exakt gepinnt.
      - run: npm install -g npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: node scripts/pack-pruefung.mjs --zweimal
      # integrity im npm-Format (sha512, base64) des einen Tarballs; der Publish-Job vergleicht dagegen.
      - name: integrity des Tarballs
        id: integritaet
        run: |
          set -- pack-ausgabe/*.tgz
          test "$#" -eq 1
          echo "integritaet=sha512-$(openssl dgst -sha512 -binary "$1" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: paket, path: pack-ausgabe/*.tgz, if-no-files-found: error }
  pruefen:
    needs: paket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install -g npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: paket, path: pack-ausgabe }
      # Ohne Geheimnis kein Überspringen: das Skript endet fail-closed mit Exit 2 und der Release stoppt.
      - name: Identifikator-Scan Tarball (F8)
        env:
          SITE_KIT_IDENTIFIKATOREN: ${{ secrets.SITE_KIT_IDENTIFIKATOREN }}
        run: node scripts/identifikator-scan.mjs pack-ausgabe/*.tgz
      - name: Identifikator-Scan Repo und Historie (P1)
        env:
          SITE_KIT_IDENTIFIKATOREN: ${{ secrets.SITE_KIT_IDENTIFIKATOREN }}
        run: |
          git fetch --no-tags origin '+refs/pull/*:refs/remotes/pull/*'
          node scripts/identifikator-scan.mjs --repo
  # Kein Checkout, kein setup-node: der Job sieht nur den geprüften Tarball. npm 11 kommt
  # exakt gepinnt über npx (Trusted Publishing braucht npm >= 11.5.1).
  veroeffentlichen:
    needs: [paket, pruefen]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: paket, path: pack-ausgabe }
      # Der heruntergeladene Tarball muss bitgleich der gepackte sein; sonst bricht der Job vor publish ab.
      - name: integrity gegen Job paket prüfen
        env:
          ERWARTET: ${{ needs.paket.outputs.integritaet }}
        run: |
          set -- pack-ausgabe/*.tgz
          test "$#" -eq 1
          test -n "$ERWARTET"
          IST="sha512-$(openssl dgst -sha512 -binary "$1" | base64 -w0)"
          test "$IST" = "$ERWARTET" || { echo "::error::integrity weicht ab: $IST ≠ $ERWARTET"; exit 1; }
      - name: Veröffentlichen (OIDC, kein Token)
        run: npx --yes npm@11.19.1 publish pack-ausgabe/*.tgz --provenance --access public
