name: CI
permissions:
  contents: read
on:
  push: { branches: ['**'] }
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      # npm 10 bricht auf diesem Lockfile ab (edgesOut); npm 11 exakt gepinnt.
      - run: npm install -g npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/pack-pruefung.mjs --zweimal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: paket, path: pack-ausgabe/*.tgz, if-no-files-found: error }
  # Identifikator-Scan im eigenen Job (Abschluss-Review): kein npm ci, kein npm test, nur Node-Bordmittel und git/tar.
  # Code aus den devDependencies läuft hier nie und kann das Scan-Skript nicht umschreiben; das Geheimnis steht nur hier.
  # Blockierend auf jedem Push und PR (Council P1), sobald das Geheimnis gesetzt ist. Ohne Geheimnis (vor dem ersten
  # Setzen, Fork-PRs) nur ein Hinweis; der Release-Workflow scheitert in diesem Fall (release.yml, Job scan).
  scan:
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: paket, path: pack-ausgabe }
      - name: Identifikator-Scan Tarball (F8)
        env:
          SITE_KIT_IDENTIFIKATOREN: ${{ secrets.SITE_KIT_IDENTIFIKATOREN }}
        run: |
          if [ -z "$SITE_KIT_IDENTIFIKATOREN" ]; then
            echo "::notice::SITE_KIT_IDENTIFIKATOREN nicht gesetzt — Identifikator-Scan übersprungen (Release scheitert ohne)."
            exit 0
          fi
          node scripts/identifikator-scan.mjs pack-ausgabe/*.tgz
      - name: Identifikator-Scan Repo, Historie und PR-Text (P1)
        env:
          SITE_KIT_IDENTIFIKATOREN: ${{ secrets.SITE_KIT_IDENTIFIKATOREN }}
          PR_TITEL: ${{ github.event.pull_request.title }}
          PR_TEXT: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$SITE_KIT_IDENTIFIKATOREN" ]; then
            echo "::notice::SITE_KIT_IDENTIFIKATOREN nicht gesetzt — Identifikator-Scan übersprungen (Release scheitert ohne)."
            exit 0
          fi
          git fetch --no-tags origin '+refs/pull/*:refs/remotes/pull/*'
          printf '%s\n%s\n' "$PR_TITEL" "$PR_TEXT" > "$RUNNER_TEMP/pr-text.txt"
          node scripts/identifikator-scan.mjs --repo --pr-text "$RUNNER_TEMP/pr-text.txt"
  # Versions-Test (Plan B12): lädt Code der Basisversion aus der Registry, deshalb eigener Job ohne Secrets und ohne id-token.
  versionen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install -g npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/versions-test.mjs
